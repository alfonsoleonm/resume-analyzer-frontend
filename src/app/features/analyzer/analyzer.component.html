<div class="analyzer-container">

    @if (isLoading) {
    <div class="loading-overlay">
        <div class="spinner"></div>
        <p>Analyzing your resume with AI...</p>
        <span class="loading-sub">This may take a few seconds</span>
    </div>
    }

    <div class="card">
        <div class="gemini-badge">
            <img src="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ff6292a690345.svg" alt="Gemini"
                width="18" height="18" />
            AI powered by Gemini
        </div>

        <h1>Resume Analyzer</h1>
        <p class="subtitle">Upload your resume and paste a job description to get an AI-powered fit analysis.</p>

        <div class="form-group">
            <label for="resume">Resume (PDF)</label>
            <input type="file" id="resume" accept=".pdf" (change)="onFileSelected($event)" />
            @if (selectedFile) {
            <span class="file-hint">{{ selectedFile.name }}</span>
            }
        </div>

        <div class="form-group">
            <label for="jobDescription">Job Description</label>
            <textarea id="jobDescription" [(ngModel)]="jobDescription"
                placeholder="Paste the full job description here..." rows="8"></textarea>
        </div>

        @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
        }

        <button class="btn-primary" (click)="onSubmit()" [disabled]="isLoading">
            Analyze Resume
        </button>
    </div>
</div>
